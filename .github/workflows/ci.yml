name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_call:
    inputs:
      revision:
        description: Commit SHA to check
        required: true
        type: string

permissions: {}

env:
  APP_DOMAIN: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
  CHAT_SERVICE_SECRET: ci-only-chat-service-secret-at-least-thirty-two-characters
  CHAT_SERVICE_URL: http://127.0.0.1:3001
  CHAT_TOKEN_ENCRYPTION_SECRET: ci-only-chat-token-encryption-secret-at-least-thirty-two-characters
  CHAT_STORE_TEST_DATABASE_URL: postgresql://streambrew:streambrew@127.0.0.1:5432/streambrew
  VIDEO_INGEST_TEST_DATABASE_URL: postgresql://streambrew:streambrew@127.0.0.1:5432/streambrew?sslmode=disable
  DATABASE_URL: postgresql://streambrew:streambrew@127.0.0.1:5432/streambrew?sslmode=disable
  DONATION_ALERTS_CLIENT_ID: "1"
  DONATION_ALERTS_CLIENT_SECRET: ci-only
  STREAMLABS_CLIENT_ID: ci-only
  STREAMLABS_CLIENT_SECRET: ci-only
  STREAMELEMENTS_CLIENT_ID: ci-only
  STREAMELEMENTS_CLIENT_SECRET: ci-only
  DONATIONS_SERVICE_SECRET: ci-only-donations-service-secret-at-least-thirty-two-characters
  DONATIONS_SERVICE_URL: http://127.0.0.1:3002
  GOOGLE_CLIENT_ID: ci-only
  GOOGLE_CLIENT_SECRET: ci-only
  RESTREAM_CREDENTIALS_SECRET: ci-only-restream-credentials-secret-at-least-thirty-two-characters
  RESTREAM_INGEST_URL: rtmp://127.0.0.1:1935
  RESTREAM_MEDIA_SHARED_SECRET: ci-only-restream-media-secret-at-least-thirty-two-characters
  YOUTUBE_CLIENT_ID: ci-only
  YOUTUBE_CLIENT_SECRET: ci-only

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Set up mise tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.24

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create empty CI environment file
        run: install -m 600 /dev/null .env

      - name: Check types
        run: just typecheck

      - name: Validate Terraform
        run: just terraform-validate

      - name: Lint and check formatting
        run: just lint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: streambrew
          POSTGRES_USER: streambrew
          POSTGRES_PASSWORD: streambrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streambrew -d streambrew"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    permissions:
      contents: read
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create empty CI environment file
        run: install -m 600 /dev/null .env

      - name: Run database migrations
        env:
          DBMATE_NO_DUMP_SCHEMA: "true"
        run: just db-migrate

      - name: Run tests
        run: just test

  image:
    # The merge queue fast-forwards main to the tested commit, so this image is
    # the one Production deploys for the same SHA.
    name: Application image
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streambrew:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # A registry cache is shared across merge-queue branches; a GitHub
          # Actions cache would stay scoped to each temporary queue branch.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/streambrew:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/streambrew:buildcache,mode=max,ignore-error=true

  quality:
    name: Quality checks
    if: always()
    needs:
      - static
      - tests
      - image
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_RESULT: ${{ needs.image.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          set -euo pipefail
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          if [[ "$EVENT_NAME" == merge_group ]]; then
            test "$IMAGE_RESULT" = success
          else
            test "$IMAGE_RESULT" = skipped
          fi
